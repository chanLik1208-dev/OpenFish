name: Build Desktop Pet (Win & Mac)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # Windows 打包任務
  # ==========================================
  build-windows:
    runs-on: windows-latest

    steps:
    - name: 下載你的程式碼
      uses: actions/checkout@v4

    - name: 安裝 Qt6 環境
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: 執行 CMake 設定
      run: cmake -B build

    - name: 開始編譯 (Release 模式)
      run: cmake --build build --config Release

    - name: 打包 Qt 依賴檔案 (windeployqt)
      run: |
        windeployqt build/Release/DesktopPet.exe

    - name: 將你的貓娘圖片複製進去打包資料夾
      run: |
        Copy-Item "*.png" -Destination "build/Release/"

    - name: 上傳最終的 Windows EXE 壓縮檔
      uses: actions/upload-artifact@v4
      with:
        name: DesktopPet-Windows-App
        path: build/Release/

  # ==========================================
  # macOS 打包任務 (新增)
  # ==========================================
  build-mac:
    runs-on: macos-latest

    steps:
    - name: 下載你的程式碼
      uses: actions/checkout@v4

    - name: 安裝 Qt6 環境
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64' # Mac 專用的編譯器架構

    - name: 執行 CMake 設定
      run: cmake -B build

    - name: 開始編譯 (Release 模式)
      run: cmake --build build --config Release

    - name: 打包 Qt 依賴檔案 (macdeployqt)
      # 針對生成的 .app 進行依賴綁定
      run: |
        macdeployqt build/DesktopPet.app

    - name: 將貓娘圖片複製進 .app 內部
      # Mac 應用程式讀取同層目錄時，會指向 Contents/MacOS/
      run: |
        cp *.png build/DesktopPet.app/Contents/MacOS/

    - name: 將 .app 壓縮成 zip (保留 Mac 檔案執行權限)
      # 直接上傳 .app 會導致 Mac 權限錯亂，先壓縮成 zip 最安全
      run: |
        cd build
        zip -r DesktopPet-Mac.zip DesktopPet.app

    - name: 上傳最終的 Mac 壓縮檔
      uses: actions/upload-artifact@v4
      with:
        name: DesktopPet-Mac-App
        path: build/DesktopPet-Mac.zip